<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>數位學伴 — AI 任務規劃系統</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#6c5ce7;--primary-dark:#5340c9;--primary-light:#ede9ff;
  --teal:#16c2a3;--green:#23b26d;--orange:#f5a623;--red:#e74c3c;
  --bg:#f0eeff;--card:#fff;--text:#2d2d3a;--muted:#6b6b80;
  --border:#ddd8f8;--shadow:0 2px 12px rgba(108,92,231,.12);
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,#f0eeff 0%,#e8f4fd 100%);min-height:100vh;color:var(--text);font-size:15px;line-height:1.6}

/* ─── 頂部導覽 ─── */
#header{background:#fff;border-bottom:2px solid var(--border);padding:0 20px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
.header-inner{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:12px;height:54px}
.logo{font-size:16px;font-weight:800;color:var(--primary);white-space:nowrap;text-decoration:none}
.logo span{color:var(--teal)}
.nav-tabs{display:flex;gap:4px;flex:1}
.nav-tab{background:none;border:none;padding:6px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);transition:.15s}
.nav-tab:hover{background:var(--primary-light);color:var(--primary)}
.nav-tab.active{background:var(--primary-light);color:var(--primary)}
#llm-btn{background:none;border:1.5px solid var(--border);border-radius:8px;padding:4px 12px;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted);white-space:nowrap;transition:.2s}
#llm-btn.ok{border-color:var(--green);color:var(--green)}
#llm-btn.err{border-color:var(--red);color:var(--red)}

/* ─── LLM 設定面板 ─── */
#llm-panel{display:none;position:fixed;top:60px;right:16px;background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:18px;width:340px;z-index:200;box-shadow:0 8px 32px rgba(108,92,231,.16)}
#llm-panel.open{display:block}
#llm-panel h3{font-size:13px;font-weight:700;color:var(--primary);margin-bottom:12px}
.lrow{display:flex;flex-direction:column;gap:3px;margin-bottom:10px}
.lrow label{font-size:12px;color:var(--muted);font-weight:600}
.lrow input,.lrow select{border:1.5px solid var(--border);border-radius:7px;padding:6px 8px;font-size:13px;width:100%;outline:none}
.lrow input:focus,.lrow select:focus{border-color:var(--primary)}
.lrow-hint{font-size:11px;color:var(--muted);margin-top:2px}
.lrow-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.lrow-status{font-size:12px;margin-top:8px;padding:6px 10px;border-radius:7px}
.lrow-status.ok{background:#e8faf3;color:var(--green)}
.lrow-status.err{background:#fdecea;color:var(--red)}
.lrow-status.loading{background:#f4f3fe;color:var(--primary)}

/* ─── 主要內容 ─── */
#main{max-width:860px;margin:0 auto;padding:28px 20px}
.view{display:none}
.view.active{display:block}

/* ─── 卡片 ─── */
.card{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.section-title{font-size:18px;font-weight:800;color:var(--primary);margin-bottom:20px}

/* ─── 表單 ─── */
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--text);margin-bottom:6px}
.field label .req{color:var(--red)}
.field input,.field textarea,.field select{width:100%;border:1.5px solid var(--border);border-radius:9px;padding:9px 12px;font-size:14px;font-family:inherit;outline:none;transition:.15s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(108,92,231,.1)}
.field textarea{resize:vertical}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.chip-group{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chip{background:#f5f3ff;border:1.5px solid var(--border);border-radius:20px;padding:4px 14px;font-size:13px;cursor:pointer;transition:.15s;font-weight:600;color:var(--muted)}
.chip:hover{border-color:var(--primary);color:var(--primary)}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.toggle-row{display:flex;align-items:center;gap:10px}
.toggle-row input[type=checkbox]{width:18px;height:18px;cursor:pointer;accent-color:var(--primary)}
.toggle-row label{font-size:14px;font-weight:700;cursor:pointer}

/* ─── 按鈕 ─── */
.btn{border:none;border-radius:9px;padding:10px 22px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--primary-dark)}
.btn-secondary{background:#f5f3ff;color:var(--primary);border:1.5px solid var(--border)}
.btn-secondary:hover:not(:disabled){background:var(--primary-light)}
.btn-success{background:var(--green);color:#fff}
.btn-success:hover:not(:disabled){background:#1a9558}
.btn-sm{padding:5px 12px;font-size:12px;border-radius:7px}
.btn-danger{background:#fdecea;color:var(--red);border:1.5px solid #f5c6c2}
.btn-danger:hover{background:#fbd5d2}
.btn-group{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}

/* ─── AI 規劃結果 ─── */
.step-card{border-left:3px solid var(--primary);padding:14px 16px;margin-bottom:12px}
.step-card.done{border-left-color:var(--green);opacity:.7}
.step-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.step-num{background:var(--primary);color:#fff;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.step-card.done .step-num{background:var(--green)}
.step-title-input{flex:1;border:1.5px solid var(--border);border-radius:7px;padding:5px 10px;font-size:14px;font-weight:700;outline:none}
.step-title-input:focus{border-color:var(--primary)}
.step-title-static{flex:1;font-size:15px;font-weight:700;color:var(--text)}
.step-body{display:grid;grid-template-columns:1fr;gap:8px}
.step-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.meta-tag{background:#f5f3ff;border-radius:6px;padding:3px 10px;font-size:12px;color:var(--primary);font-weight:600}
.meta-tag.green{background:#e8faf3;color:var(--green)}
.meta-tag.orange{background:#fff8ed;color:var(--orange)}

/* ─── 提醒卡片 ─── */
.reminder-card{padding:14px 16px;margin-bottom:10px}
.reminder-card.disabled{opacity:.5}
.reminder-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.reminder-num{background:var(--teal);color:#fff;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700}
.step-tag{background:#f5f3ff;border-radius:6px;padding:2px 8px;font-size:11px;color:var(--primary);font-weight:600;flex:1}
.toggle-btn{border:none;border-radius:6px;padding:3px 10px;font-size:11px;font-weight:700;cursor:pointer}
.toggle-btn.on{background:#e8faf3;color:var(--green)}
.toggle-btn.off{background:#f5f3fe;color:var(--muted)}
.message-box{background:#f9f8ff;border:1.5px solid var(--border);border-radius:8px;padding:10px;font-size:12px;white-space:pre-wrap;line-height:1.7;color:var(--text);font-family:inherit}
.message-textarea{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:8px;font-size:12px;font-family:inherit;line-height:1.7;outline:none;resize:vertical}
.message-textarea:focus{border-color:var(--primary)}

/* ─── 任務列表 ─── */
.task-item{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;border-bottom:1px solid #f0eeff;transition:.15s}
.task-item:last-child{border-bottom:none}
.task-item:hover{background:#faf9ff}
.task-icon{width:40px;height:40px;border-radius:10px;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.task-info{flex:1;min-width:0}
.task-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-meta{font-size:12px;color:var(--muted);margin-top:2px}
.task-status{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap}
.status-pending{background:#f4f3fe;color:var(--primary)}
.status-in_progress{background:#fff8ed;color:var(--orange)}
.status-completed{background:#e8faf3;color:var(--green)}
.progress-bar{height:4px;background:#ede9ff;border-radius:9px;overflow:hidden;margin-top:6px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--teal));border-radius:9px;transition:width .4s}

/* ─── 任務詳情 ─── */
.detail-header{display:flex;align-items:flex-start;gap:12px;margin-bottom:20px}
.detail-icon{width:48px;height:48px;border-radius:12px;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.detail-info{flex:1}
.detail-title{font-size:20px;font-weight:800;color:var(--text)}
.detail-meta{font-size:13px;color:var(--muted);margin-top:4px}
.step-check{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid #f0eeff}
.step-check:last-child{border-bottom:none}
.step-check input[type=checkbox]{width:18px;height:18px;margin-top:2px;flex-shrink:0;cursor:pointer;accent-color:var(--green)}
.step-check-body{flex:1}
.step-check-title{font-weight:700;font-size:14px}
.step-check-desc{font-size:13px;color:var(--muted);margin-top:2px}

/* ─── 空狀態 ─── */
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty-title{font-size:16px;font-weight:700;margin-bottom:6px}
.empty-sub{font-size:13px}

/* ─── Loading ─── */
.loading-wrap{text-align:center;padding:40px 20px}
.spinner{width:40px;height:40px;border:4px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ─── Toast ─── */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2d2d3a;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}

/* ─── 快速複製提醒 ─── */
.copy-reminder-section{margin-top:16px}
.copy-btn{background:#f5f3ff;border:1.5px solid var(--border);border-radius:7px;padding:4px 12px;font-size:12px;font-weight:600;cursor:pointer;color:var(--primary);transition:.15s}
.copy-btn:hover{background:var(--primary-light)}

/* ─── 響應式 ─── */
@media(max-width:600px){
  .header-inner{gap:6px}
  .nav-tab{padding:6px 8px;font-size:12px}
  #llm-panel{width:calc(100vw - 32px);right:16px}
}
</style>
</head>
<body>

<!-- ─── 頂部導覽 ─── -->
<div id="header">
  <div class="header-inner">
    <span class="logo">📚 數位<span>學伴</span></span>
    <div class="nav-tabs">
      <button class="nav-tab active" onclick="showView('overview')">我的任務</button>
      <button class="nav-tab" onclick="showView('create')">建立任務</button>
    </div>
    <button id="llm-btn" onclick="toggleLlmPanel()">🔌 連接 LLM</button>
  </div>
</div>

<!-- ─── LLM 設定面板 ─── -->
<div id="llm-panel">
  <h3>🔌 本機 LLM 設定</h3>
  <div class="lrow">
    <label>預設（Ollama）</label>
    <select id="llm-preset" onchange="applyPreset()">
      <option value="ollama">Ollama（localhost:11434）</option>
      <option value="lmstudio">LM Studio（localhost:1234）</option>
      <option value="custom">自訂端點</option>
    </select>
  </div>
  <div class="lrow">
    <label>API 端點</label>
    <input id="llm-ep" type="text" value="http://localhost:11434/v1" placeholder="http://localhost:11434/v1">
  </div>
  <div class="lrow">
    <label>模型名稱</label>
    <input id="llm-model" type="text" value="llama3" placeholder="llama3">
    <div class="lrow-hint">Ollama 範例：llama3、gemma2:2b、qwen2.5</div>
  </div>
  <div class="lrow">
    <label>API Key（選填）</label>
    <input id="llm-key" type="password" placeholder="若不需要請留空">
  </div>
  <div class="lrow-actions">
    <button class="btn btn-primary btn-sm" onclick="testLlm()">測試連線</button>
    <button class="btn btn-secondary btn-sm" onclick="saveLlmConfig()">儲存</button>
    <button class="btn btn-secondary btn-sm" onclick="fetchModels()">抓取模型列表</button>
  </div>
  <div id="llm-status" class="lrow-status" style="display:none"></div>
</div>

<!-- ─── 主要內容 ─── -->
<div id="main">

  <!-- ── 任務列表 ── -->
  <div id="view-overview" class="view active">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
      <div class="section-title" style="margin:0">我的任務</div>
      <button class="btn btn-primary btn-sm" onclick="showView('create')">＋ 新增任務</button>
    </div>
    <div class="card" style="padding:0;overflow:hidden">
      <div id="task-list-body"></div>
    </div>
  </div>

  <!-- ── 建立任務 ── -->
  <div id="view-create" class="view">
    <div class="card">
      <div class="section-title">✏️ 建立新任務</div>

      <div class="field">
        <label>任務名稱 <span class="req">*</span></label>
        <input id="f-name" type="text" placeholder="例如：完成期末報告、學習 Python 基礎">
      </div>

      <div class="field">
        <label>我想完成什麼 <span class="req">*</span></label>
        <textarea id="f-goal" rows="4" placeholder="詳細描述你想達成的目標，越具體越好。例如：我想完成一份 10 頁的機器學習期末報告，包含文獻回顧和實驗結果分析。"></textarea>
      </div>

      <div class="field">
        <label>截止時間 <span class="req">*</span></label>
        <input id="f-deadline" type="datetime-local">
      </div>

      <div class="field">
        <label>目前可用時間</label>
        <input id="f-avail" type="text" placeholder="例如：每天下午 2 小時、週末整天">
      </div>

      <div class="field">
        <label>任務類型</label>
        <div class="chip-group" id="type-chips"></div>
      </div>

      <div class="field">
        <label>可使用工具（可多選）</label>
        <div class="chip-group" id="tool-chips"></div>
      </div>

      <div id="create-error" style="display:none;color:var(--red);font-size:13px;margin-bottom:12px"></div>

      <div class="btn-group" style="margin-top:8px">
        <button class="btn btn-primary" id="btn-generate" onclick="generatePlan()">🤖 產生 AI 規劃</button>
        <button class="btn btn-secondary" onclick="showView('overview')">取消</button>
      </div>
    </div>
  </div>

  <!-- ── 確認計畫 ── -->
  <div id="view-confirm" class="view">
    <div id="confirm-body"></div>
  </div>

  <!-- ── 任務詳情 ── -->
  <div id="view-detail" class="view">
    <div id="detail-body"></div>
  </div>

</div>

<!-- ─── Toast ─── -->
<div id="toast"></div>

<script>
// ════════════════════════════════════════════
//  常數
// ════════════════════════════════════════════
const TASK_TYPES = ['學習','寫作','研究','簡報','程式','行政','規劃','複習','其他'];
const TOOLS = ['ChatGPT','Notion','Google Docs','Google Sheets','Canva','Obsidian','手寫筆記','番茄鐘','Codex','其他'];
const TASK_ICONS = {學習:'📖',寫作:'✍️',研究:'🔬',簡報:'🖥️',程式:'💻',行政:'📋',規劃:'🗓️',複習:'🔁',其他:'📌'};

// ════════════════════════════════════════════
//  狀態
// ════════════════════════════════════════════
let state = {
  llm: { endpoint:'http://localhost:11434/v1', model:'llama3', apiKey:'' },
  tasks: [],  // [{id, name, goal_description, deadline, available_time, task_type, tools:[], ai_plan:{goal,suggested_tools,steps,reminders}, status, created_at}]
  form: { task_type:'學習', tools:[] },
  pendingPlan: null,    // {formData, plan}
  currentTaskId: null,
};

// ════════════════════════════════════════════
//  持久化
// ════════════════════════════════════════════
function save() {
  try { localStorage.setItem('sb_state', JSON.stringify(state)); } catch(e){}
}
function load() {
  try {
    const raw = localStorage.getItem('sb_state');
    if (raw) {
      const saved = JSON.parse(raw);
      state.llm = saved.llm || state.llm;
      state.tasks = saved.tasks || [];
    }
  } catch(e){}
}

// ════════════════════════════════════════════
//  UI 工具
// ════════════════════════════════════════════
function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  document.querySelectorAll('.nav-tab').forEach((t, i) => {
    t.classList.toggle('active', (i === 0 && name === 'overview') || (i === 1 && name === 'create'));
  });
  if (name === 'overview') renderTaskList();
}

function toast(msg, dur=2500) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), dur);
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function fmtDate(iso) {
  try { return new Date(iso).toLocaleString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}); }
  catch{return iso;}
}

function toInputFmt(iso) {
  try { return new Date(iso).toISOString().slice(0,16); } catch{return '';}
}

// ════════════════════════════════════════════
//  LLM 面板
// ════════════════════════════════════════════
function toggleLlmPanel() {
  document.getElementById('llm-panel').classList.toggle('open');
}

function applyPreset() {
  const preset = document.getElementById('llm-preset').value;
  if (preset === 'ollama') {
    document.getElementById('llm-ep').value = 'http://localhost:11434/v1';
    document.getElementById('llm-model').value = 'llama3';
  } else if (preset === 'lmstudio') {
    document.getElementById('llm-ep').value = 'http://localhost:1234/v1';
    document.getElementById('llm-model').value = 'local-model';
  }
}

function saveLlmConfig() {
  state.llm.endpoint = document.getElementById('llm-ep').value.replace(/\/+$/,'');
  state.llm.model = document.getElementById('llm-model').value;
  state.llm.apiKey = document.getElementById('llm-key').value;
  save();
  toast('✅ LLM 設定已儲存');
  document.getElementById('llm-panel').classList.remove('open');
}

function setLlmStatus(msg, cls) {
  const el = document.getElementById('llm-status');
  el.style.display = 'block';
  el.className = 'lrow-status ' + cls;
  el.textContent = msg;
}

async function testLlm() {
  setLlmStatus('連線測試中…', 'loading');
  const ep = document.getElementById('llm-ep').value.replace(/\/+$/,'');
  const model = document.getElementById('llm-model').value;
  const key = document.getElementById('llm-key').value;
  const headers = {'Content-Type':'application/json'};
  if (key) headers['Authorization'] = 'Bearer ' + key;
  try {
    const res = await fetch(ep + '/chat/completions', {
      method:'POST', headers,
      body: JSON.stringify({model, messages:[{role:'user',content:'回覆OK'}], max_tokens:10, stream:false})
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    await res.json();
    setLlmStatus('✅ 連線成功！', 'ok');
    document.getElementById('llm-btn').className = 'ok';
    document.getElementById('llm-btn').textContent = '✅ LLM 已連線';
  } catch(e) {
    setLlmStatus('❌ 失敗：' + e.message, 'err');
    document.getElementById('llm-btn').className = 'err';
    document.getElementById('llm-btn').textContent = '⚠️ LLM 未連線';
  }
}

async function fetchModels() {
  setLlmStatus('抓取模型列表中…', 'loading');
  const ep = document.getElementById('llm-ep').value.replace(/\/+$/,'');
  const key = document.getElementById('llm-key').value;
  const headers = {};
  if (key) headers['Authorization'] = 'Bearer ' + key;
  try {
    const res = await fetch(ep + '/models', {headers});
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const models = (data.data || data.models || []).map(m => m.id || m.name || m).filter(Boolean);
    if (!models.length) { setLlmStatus('找不到模型', 'err'); return; }
    const sel = `<select onchange="document.getElementById('llm-model').value=this.value" style="width:100%;border:1.5px solid var(--border);border-radius:7px;padding:5px 8px;font-size:13px;margin-top:6px">` +
      models.map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join('') + '</select>';
    setLlmStatus('找到 ' + models.length + ' 個模型：', 'ok');
    document.getElementById('llm-status').innerHTML += sel;
    document.getElementById('llm-model').value = models[0];
  } catch(e) {
    setLlmStatus('❌ 失敗：' + e.message, 'err');
  }
}

function initForm() {
  // 任務類型 chips
  const tc = document.getElementById('type-chips');
  TASK_TYPES.forEach(type => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip' + (type === state.form.task_type ? ' on' : '');

      tc.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
      b.classList.add('on');
    };
    tc.appendChild(b);
  });

  // 工具 chips
  const toolc = document.getElementById('tool-chips');
  TOOLS.forEach(tool => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip' + (state.form.tools.includes(tool) ? ' on' : '');

    b.onclick = () => {

        state.form.tools = state.form.tools.filter(t => t !== tool);
      } else {
        state.form.tools.push(tool);
      }

    toolc.appendChild(b);
  });

  // 截止時間預設（明天）
  const tmr = new Date(); tmr.setDate(tmr.getDate()+7); tmr.setHours(23,59,0,0);
  document.getElementById('f-deadline').value = tmr.toISOString().slice(0,16);
  document.getElementById('f-deadline').min = new Date().toISOString().slice(0,16);
}

// ════════════════════════════════════════════
function buildPrompt(fd) {
  const deadline = new Date(fd.deadline);
  const daysLeft = Math.ceil((deadline - Date.now()) / 86400000);
  const exampleTime = new Date(); exampleTime.setDate(exampleTime.getDate()+1); exampleTime.setHours(9,0,0,0);
  const exIso = exampleTime.toISOString().replace('Z','').slice(0,19);
  return `你是一個專業的任務規劃助手。請根據以下任務資訊，產生一份詳細的執行計畫。

【任務資訊】
任務名稱：${fd.name}
我想完成什麼：${fd.goal}
截止時間：${fd.deadline}（距今約 ${daysLeft} 天）
目前可用時間：${fd.available_time || '未指定'}
任務類型：${fd.task_type}
可使用工具：${fd.tools.length ? fd.tools.join('、') : '未指定'}

【回覆要求】
請務必以純 JSON 格式回覆，不要有任何說明文字、markdown 語法或程式碼區塊符號。
回覆的 JSON 結構如下：

{
  "goal": "清楚描述這個任務要達成什麼目標（1～2句話）",
  "suggested_tools": ["最適合的工具清單"],
  "steps": [
    {
      "title": "步驟標題（簡短清楚）",
      "description": "這個步驟要做什麼、怎麼做（2～3句話）",
      "estimated_time": "建議花費時間，例如：30分鐘",
      "tool_suggestion": "這個步驟建議使用的工具",
      "completion_criteria": "怎樣算是完成了這個步驟（具體可驗證的標準）"
    }
  ],
  "reminders": [
    {
      "remind_at": "ISO 8601 格式，例如：${exIso}",
      "step_index": 0,
      "message": "【任務提醒】\\n任務：${fd.name}\\n現在要做：（步驟標題）\\n建議工具：（工具）\\n完成標準：（完成標準）"
    }
  ]
}

注意事項：
1. 步驟數量建議 3～7 個，根據任務複雜度決定
2. 提醒時間要合理分散，考慮截止時間和可用時間
3. 每個步驟建議搭配一則提醒
4. 所有時間格式必須是 ISO 8601（例如：${exIso}）`;
}

async function callLlm(prompt) {
  const {endpoint, model, apiKey} = state.llm;
  const ep = endpoint.replace(/\/+$/,'');
  const headers = {'Content-Type':'application/json'};
  if (apiKey) headers['Authorization'] = 'Bearer ' + apiKey;
  const res = await fetch(ep + '/chat/completions', {
    method:'POST', headers,
    body: JSON.stringify({
      model,
      messages:[
        {role:'system', content:'你是專業的任務規劃助手，只回覆純 JSON，不加任何說明或 markdown。'},
        {role:'user', content:prompt}
      ],
      temperature:0.7, max_tokens:4096, stream:false
    })
  });
  if (!res.ok) {
    const err = await res.text();
    throw new Error(`API 錯誤 ${res.status}：${err.slice(0,200)}`);
  }
  const data = await res.json();
  const raw = data.choices[0].message.content;
  const match = raw.match(/\{[\s\S]*\}/);
  if (!match) throw new Error('LLM 回覆中找不到有效的 JSON。\n請確認模型已正確載入。');
  const plan = JSON.parse(match[0]);
  if (!plan.goal || !Array.isArray(plan.steps) || !plan.steps.length) throw new Error('LLM 回傳格式不正確，請再試一次。');
  if (!Array.isArray(plan.reminders)) plan.reminders = [];
  if (!Array.isArray(plan.suggested_tools)) plan.suggested_tools = [];
  return plan;
}

async function generatePlan() {
  const name = document.getElementById('f-name').value.trim();
  const goal = document.getElementById('f-goal').value.trim();
  const deadline = document.getElementById('f-deadline').value;
  const errEl = document.getElementById('create-error');

  if (!name || !goal || !deadline) {
    errEl.style.display = 'block';
    errEl.textContent = '⚠️ 請填寫任務名稱、想完成什麼、以及截止時間。';
    return;
  }
  errEl.style.display = 'none';

  const fd = {
    name, goal, deadline,
    available_time: document.getElementById('f-avail').value.trim(),
    task_type: state.form.task_type,
    tools: [...state.form.tools]
  };

  const btn = document.getElementById('btn-generate');
  btn.disabled = true;
  btn.textContent = '⏳ AI 規劃中，請稍候…';

  showView('confirm');
  document.getElementById('confirm-body').innerHTML = `
    <div class="loading-wrap">
      <div class="spinner"></div>
      <div style="font-weight:700;color:var(--primary)">AI 正在為你規劃任務…</div>
      <div style="font-size:13px;color:var(--muted);margin-top:6px">通常需要 10～60 秒，請耐心等待</div>
    </div>`;

  try {
    const plan = await callLlm(buildPrompt(fd));
    state.pendingPlan = {formData: fd, plan};
    renderConfirm();
  } catch(e) {
    document.getElementById('confirm-body').innerHTML = `
      <div class="card" style="border-color:var(--red)">
        <div style="color:var(--red);font-weight:700;margin-bottom:8px">❌ 規劃失敗</div>
        <div style="font-size:13px;color:var(--text);white-space:pre-wrap">${esc(e.message)}</div>
        <div style="margin-top:16px">
          <button class="btn btn-secondary" onclick="showView('create')">← 返回修改</button>
        </div>
      </div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = '🤖 產生 AI 規劃';
  }
}

function toggleReminder(i) {
  const btn = document.getElementById('rem-toggle-' + i);
  const body = document.getElementById('rem-body-' + i);
  const card = document.getElementById('rem-card-' + i);
  const enabled = btn.classList.contains('on');
  if (enabled) {
    btn.classList.replace('on','off'); btn.textContent = '已停用';
    body.style.display = 'none'; card.classList.add('disabled');
  } else {
    btn.classList.replace('off','on'); btn.textContent = '✓ 啟用';
    body.style.display = ''; card.classList.remove('disabled');
  }
}

function confirmCreate() {
  if (!state.pendingPlan) return;
  const {formData:fd, plan} = state.pendingPlan;

  // 收集編輯後的步驟
  const steps = plan.steps.map((s, i) => ({
    ...s,
    title: document.getElementById('st-title-' + i)?.value || s.title,
    description: document.getElementById('st-desc-' + i)?.value || s.description,
    estimated_time: document.getElementById('st-time-' + i)?.value || s.estimated_time,
    tool_suggestion: document.getElementById('st-tool-' + i)?.value || s.tool_suggestion,
    completion_criteria: document.getElementById('st-crit-' + i)?.value || s.completion_criteria,
    status: 'pending'
  }));

  // 收集提醒（過濾停用的）
  const reminders = plan.reminders
    .map((r, i) => {
      const btn = document.getElementById('rem-toggle-' + i);
      if (!btn || !btn.classList.contains('on')) return null;
      return {
        ...r,
        remind_at: (() => { try { return new Date(document.getElementById('rem-time-'+i).value).toISOString(); } catch{ return r.remind_at; } })(),
        message: document.getElementById('rem-msg-' + i)?.value || r.message,
        status: 'pending'
      };
    }).filter(Boolean);

  const task = {
    id: Date.now(),
    name: fd.name,
    goal_description: fd.goal,
    deadline: fd.deadline,
    available_time: fd.available_time,
    task_type: fd.task_type,
    tools: fd.tools,
    status: 'pending',
    ai_plan: { goal: plan.goal, suggested_tools: plan.suggested_tools, steps, reminders },
    created_at: new Date().toISOString()
  };

  state.tasks.unshift(task);
  state.pendingPlan = null;
  save();

  // 重設表單
  document.getElementById('f-name').value = '';
  document.getElementById('f-goal').value = '';
  state.form.tools = [];
  state.form.task_type = '學習';

  toast('✅ 任務建立成功！');
  openTask(task.id);
}

function renderTaskList() {

function openTask(id) {
  const task = state.tasks.find(t => t.id === id);
  if (!task) return;
  state.currentTaskId = id;
  renderDetail(task);
  showView('detail');
}

function renderDetail(task) {
  const plan = task.ai_plan || {};
  const steps = plan.steps || [];
  const reminders = plan.reminders || [];
  const done = steps.filter(s => s.status === 'completed').length;
  const pct = steps.length ? Math.round(done/steps.length*100) : 0;
  const icon = TASK_ICONS[task.task_type] || '📌';

  let html = `
    <div class="card">
      <div class="detail-header">
        <div class="detail-icon">${icon}</div>
        <div class="detail-info">
          <div class="detail-title">${esc(task.name)}</div>
          <div class="detail-meta">
            ${esc(task.task_type)} · 截止：${fmtDate(task.deadline)}
            ${task.available_time ? ' · ' + esc(task.available_time) : ''}
          </div>
        </div>
        <select class="btn btn-sm" style="font-size:12px;padding:5px 10px;cursor:pointer" onchange="updateTaskStatus(${task.id}, this.value)">
          <option value="pending" ${task.status==='pending'?'selected':''}>待開始</option>
          <option value="in_progress" ${task.status==='in_progress'?'selected':''}>進行中</option>
          <option value="completed" ${task.status==='completed'?'selected':''}>已完成</option>
        </select>
      </div>
      ${plan.goal ? `<div style="background:#f4f3fe;border-radius:8px;padding:10px 14px;font-size:13px;color:var(--primary);margin-bottom:12px">🎯 <strong>目標：</strong>${esc(plan.goal)}</div>` : ''}
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
        <div style="font-size:13px;color:var(--muted)">進度 ${done}/${steps.length}</div>
        <div style="flex:1"><div class="progress-bar" style="height:8px"><div class="progress-fill" style="width:${pct}%"></div></div></div>
        <div style="font-size:13px;font-weight:700;color:var(--primary)">${pct}%</div>
      </div>
    </div>`;

  if (steps.length) {
    html += `<div class="card"><div style="font-size:15px;font-weight:800;margin-bottom:12px">📝 任務步驟</div>`;
    steps.forEach((step, i) => {
      const isDone = step.status === 'completed';
      html += `
        <div class="step-check">
          <input type="checkbox" ${isDone?'checked':''} onchange="toggleStep(${task.id}, ${i}, this.checked)">
          <div class="step-check-body" style="${isDone?'text-decoration:line-through;opacity:.6':''}">
            <div class="step-check-title">${esc(step.title)}</div>
            <div class="step-check-desc">${esc(step.description)}</div>
            <div class="step-meta" style="margin-top:4px">
              ${step.estimated_time ? `<span class="meta-tag orange">⏱ ${esc(step.estimated_time)}</span>` : ''}
              ${step.tool_suggestion ? `<span class="meta-tag">🔧 ${esc(step.tool_suggestion)}</span>` : ''}
              ${step.completion_criteria ? `<span class="meta-tag green">✅ ${esc(step.completion_criteria)}</span>` : ''}
            </div>
          </div>
        </div>`;
    });
    html += '</div>';
  }

  if (reminders.length) {
    html += `<div class="card"><div style="font-size:15px;font-weight:800;margin-bottom:12px">📱 提醒清單</div>`;
    html += `<div style="font-size:12px;color:var(--muted);margin-bottom:12px">你可以複製提醒訊息，手動設定手機或日曆提醒</div>`;
    reminders.forEach((rem, i) => {
      const stepTitle = steps[rem.step_index]?.title || `步驟 ${rem.step_index+1}`;
      const isPast = new Date(rem.remind_at) < new Date();
      html += `
        <div style="border:1.5px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;${isPast?'opacity:.6':''}">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap">
            <span class="reminder-num">提醒 ${i+1}</span>
            <span style="font-size:12px;font-weight:700;color:var(--text)">⏰ ${fmtDate(rem.remind_at)}</span>
            ${isPast?'<span style="font-size:11px;background:#fdecea;color:var(--red);padding:2px 8px;border-radius:6px">已過期</span>':''}
            <span class="step-tag">→ ${esc(stepTitle)}</span>
          </div>
          <div class="message-box">${esc(rem.message)}</div>
          <div style="margin-top:8px">
            <button class="copy-btn" onclick="copyText(\`${rem.message.replace(/`/g,'\\`')}\`)">📋 複製訊息</button>
          </div>
        </div>`;
    });
    html += '</div>';
  }

  html += `
    <div class="btn-group">
      <button class="btn btn-secondary" onclick="showView('overview')">← 返回列表</button>
      <button class="btn btn-danger btn-sm" onclick="deleteTask(${task.id})">🗑 刪除任務</button>
    </div>`;

  document.getElementById('detail-body').innerHTML = html;
}

function toggleStep(taskId, stepIdx, checked) {
  const task = state.tasks.find(t => t.id === taskId);
  if (!task || !task.ai_plan?.steps[stepIdx]) return;
  task.ai_plan.steps[stepIdx].status = checked ? 'completed' : 'pending';
  // 自動更新任務狀態
  const steps = task.ai_plan.steps;
  const done = steps.filter(s => s.status === 'completed').length;
  if (done === steps.length) task.status = 'completed';
  else if (done > 0) task.status = 'in_progress';
  else task.status = 'pending';
  save();
  renderDetail(task);
}

function updateTaskStatus(taskId, status) {
  const task = state.tasks.find(t => t.id === taskId);
  if (!task) return;
  task.status = status;
  save();
  toast('✅ 狀態已更新');
}

function deleteTask(taskId) {
  if (!confirm('確定要刪除這個任務嗎？')) return;
  state.tasks = state.tasks.filter(t => t.id !== taskId);
  save();
  toast('🗑 任務已刪除');
  showView('overview');
}

function copyText(text) {
  navigator.clipboard.writeText(text).then(() => toast('✅ 已複製到剪貼簿'));
}

// ════════════════════════════════════════════
//  LLM 面板點外關閉
// ════════════════════════════════════════════
document.addEventListener('click', e => {
  const panel = document.getElementById('llm-panel');
  const btn = document.getElementById('llm-btn');
  if (panel.classList.contains('open') && !panel.contains(e.target) && e.target !== btn) {
    panel.classList.remove('open');
  }
});

// ════════════════════════════════════════════
//  啟動
// ════════════════════════════════════════════
(function init() {
  load();

  // 填入 LLM 設定
  document.getElementById('llm-ep').value = state.llm.endpoint;
  document.getElementById('llm-model').value = state.llm.model;
  document.getElementById('llm-key').value = state.llm.apiKey || '';

  initForm();
  renderTaskList();

  // 自動偵測 LLM 連線
  (async () => {
    try {
      const ep = state.llm.endpoint.replace(/\/+$/,'');
      const headers = state.llm.apiKey ? {'Authorization':'Bearer '+state.llm.apiKey} : {};
      const res = await fetch(ep + '/models', {headers});
      if (res.ok) {
        document.getElementById('llm-btn').className = 'ok';
        document.getElementById('llm-btn').textContent = '✅ LLM 已連線';
      }
    } catch(e){}
  })();
})();
</script>
</body>
</html>
